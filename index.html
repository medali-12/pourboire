<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Pourboire</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      margin: 0;
      padding: 20px;
    }
    h1, h2 { text-align: center; }
    .container { max-width: 600px; margin: auto; }
    form {
      background: #1c1c1c;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
      border: none;
      font-size: 1rem;
    }
    input, textarea { background: #000; color: #fff; }
    button { background: #0d6efd; color: #fff; cursor: pointer; }
    button:hover { background: #0b5ed7; }
    ul { list-style: none; padding: 0; }
    li {
      background: #1c1c1c;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Page de pourboire</h1>

    <!-- FORMULAIRE MESSAGE -->
    <h2>Envoyer un message</h2>
    <form action="https://formspree.io/f/TON_ID_FORMSPREE" method="POST">
      <input type="text" name="nom" placeholder="Ton nom" required>
      <textarea name="message" placeholder="Ton message" rows="4" required></textarea>
      <button type="submit">Envoyer</button>
    </form>

    <!-- CLASSEMENT -->
    <h2>Classement</h2>
    <form id="score-form">
      <input type="text" id="pseudo" placeholder="Pseudo" required>
      <input type="number" id="points" placeholder="Points" required>
      <button type="submit">Ajouter</button>
    </form>

    <ul id="score-list"></ul>
  </div>

  <!-- FIREBASE -->
  <script type="module">
    // 🔥 1) COLLE ICI TA CONFIG FIREBASE
    const firebaseConfig = {
      apiKey: "TON_API_KEY",
      authDomain: "TON_PROJET.firebaseapp.com",
      databaseURL: "https://TON_PROJET-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "TON_PROJET",
      storageBucket: "TON_PROJET.appspot.com",
      messagingSenderId: "TON_SENDER_ID",
      appId: "TON_APP_ID"
    };

    // 🚀 NE TOUCHE PLUS À PARTIR D’ICI
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
      getDatabase, ref, push, onValue
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const scoresRef = ref(db, "scores");

    const scoreForm = document.getElementById("score-form");
    const scoreList = document.getElementById("score-list");

    // Ajouter un score
    scoreForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const pseudo = document.getElementById("pseudo").value.trim();
      const points = Number(document.getElementById("points").value);

      if (!pseudo || isNaN(points)) return;

      push(scoresRef, { pseudo, points, createdAt: Date.now() });

      document.getElementById("pseudo").value = "";
      document.getElementById("points").value = "";
    });

    // Afficher le classement
    onValue(scoresRef, (snapshot) => {
      const data = snapshot.val() || {};
      const entries = Object.values(data).sort((a, b) => b.points - a.points);

      scoreList.innerHTML = "";
      entries.forEach((item, i) => {
        const li = document.createElement("li");
        li.innerHTML = `<span>#${i + 1} - ${item.pseudo}</span><span>${item.points} pts</span>`;
        scoreList.appendChild(li);
      });
    });
  </script>
</body>
</html>
