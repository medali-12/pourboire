<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Pourboire</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #f5f5f5;
      margin: 0;
      padding: 20px;
    }
    h1, h2 {
      text-align: center;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    form {
      background: #1c1c1c;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }
    input, textarea, button {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #000;
      color: #f5f5f5;
      font-size: 0.95rem;
    }
    button {
      background: #0d6efd;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover {
      background: #0b5ed7;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      background: #1c1c1c;
      margin-bottom: 6px;
      padding: 8px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
    }
    .small {
      font-size: 0.8rem;
      color: #aaa;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Page de pourboire</h1>

    <!-- FORMULAIRE MESSAGE (Formspree) -->
    <h2>Envoyer un message</h2>
    <form id="contact-form" action="https://formspree.io/f/TON_ID_FORMSPREE" method="POST">
      <label for="nom">Ton nom</label>
      <input type="text" id="nom" name="nom" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="4" required></textarea>

      <button type="submit">Envoyer le message</button>
    </form>
    <p class="small">Les messages te seront envoyés par email via Formspree.</p>

    <!-- CLASSEMENT (Firebase) -->
    <h2>Classement</h2>
    <form id="score-form">
      <label for="pseudo">Pseudo</label>
      <input type="text" id="pseudo" required>

      <label for="points">Points</label>
      <input type="number" id="points" required>

      <button type="submit">Ajouter au classement</button>
    </form>

    <ul id="score-list"></ul>
    <p class="small">Le classement est partagé entre tous les utilisateurs (Firebase).</p>
  </div>

  <!-- SCRIPT FIREBASE + CLASSEMENT -->
  <script type="module">
    // ⚠️ 1) COLLE ICI TA CONFIG FIREBASE
    // Va sur https://console.firebase.google.com
    // - Crée un projet
    // - Ajoute une appli Web
    // - Copie le bloc "firebaseConfig" et remplace ci-dessous

    const firebaseConfig = {
      apiKey: "TON_API_KEY",
      authDomain: "TON_PROJET.firebaseapp.com",
      databaseURL: "https://TON_PROJET-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "TON_PROJET",
      storageBucket: "TON_PROJET.appspot.com",
      messagingSenderId: "TON_SENDER_ID",
      appId: "TON_APP_ID"
    };

    // ⚠️ NE TOUCHE PLUS À PARTIR D’ICI (juste copier-coller)

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
      getDatabase,
      ref,
      push,
      onValue
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const scoresRef = ref(db, "scores");

    const scoreForm = document.getElementById("score-form");
    const scoreList = document.getElementById("score-list");

    // Ajouter un score
    scoreForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const pseudoInput = document.getElementById("pseudo");
      const pointsInput = document.getElementById("points");

      const pseudo = pseudoInput.value.trim();
      const points = Number(pointsInput.value);

      if (!pseudo || isNaN(points)) return;

      push(scoresRef, {
        pseudo,
        points: points,
        createdAt: Date.now()
      });

      pseudoInput.value = "";
      pointsInput.value = "";
    });

    // Afficher le classement en temps réel
    onValue(scoresRef, (snapshot) => {
      const data = snapshot.val() || {};
      const entries = Object.values(data);

      // Tri par points décroissants
      entries.sort((a, b) => b.points - a.points);

      scoreList.innerHTML = "";
      entries.forEach((item, index) => {
        const li = document.createElement("li");
        li.innerHTML = `
          <span>#${index + 1} - ${item.pseudo}</span>
          <span>${item.points} pts</span>
        `;
        scoreList.appendChild(li);
      });
    });
  </script>
</body>
</html>
